# .github/workflows/deploy-frontend.yml
name: Deploy frontend

on:
  push:
    branches: [prod]
    paths: ['frontend/**']
  # Manual fallback — see deploy-infra.yml's comment on the same trigger.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Vite inlines these at build time — they must be set here, not at
      # ECS/runtime, since this deploy is a static build with no server.
      - working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PAYMENT_GATEWAY_API_URL: https://api-sandbox.co.uat.wompi.dev/v1
          VITE_PAYMENT_GATEWAY_PUBLIC_KEY: ${{ secrets.VITE_PAYMENT_GATEWAY_PUBLIC_KEY }}
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - run: aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_BUCKET }} --delete

      - run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"