# .github/workflows/deploy-backend.yml
name: Deploy backend

on:
  push:
    branches: [prod]
    paths: ['backend/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        working-directory: backend
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.registry }}/checkout-backend:${{ github.sha }} \
            -t ${{ steps.ecr.outputs.registry }}/checkout-backend:latest \
            .
          docker push ${{ steps.ecr.outputs.registry }}/checkout-backend:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/checkout-backend:latest

      # ECS/Fargate, not App Runner — see README's "Why ECS/Fargate instead
      # of App Runner". The task definition tracks the `latest` tag; this
      # just tells the service to redeploy against whatever that now points to.
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --force-new-deployment

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ secrets.BACKEND_URL }}