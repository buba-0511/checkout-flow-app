# .github/workflows/deploy-infra.yml
name: Deploy infra

on:
  pull_request:
    branches: [dev]
    paths: ['infrastructure/**']
  push:
    branches: [prod]
    paths: ['infrastructure/**']
  # Manual fallback — path-filtered push events don't fire when a branch
  # is created pointing at a commit that already exists elsewhere (no
  # file diff for GitHub to evaluate the paths filter against). Run this
  # from the prod branch in the Actions tab when that happens.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - run: terraform init
      - run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan

      - name: Terraform apply
        if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve